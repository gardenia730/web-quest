<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>凱皇的絕美瞬間｜照片相簿🩵</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body class="theme-blue">
  <header>
    <img src="images/Karry.svg" alt="《K》篇章">
    <div>
      <h1>帶你看看<br>不一樣的凱皇 📸</h1>
      <p>精選舞台、影視與日常碎片，<br>帶你全方位感受<strong>王俊凱</strong>的魅力！</p>
    </div>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">回推坑首頁</a></li>
      <li><a href="#stage">舞台魅力</a></li>
      <li><a href="#movies">影視劇照</a></li>
      <li><a href="#daily">日常碎片</a></li>
    </ul>
  </nav>
  <li><button type="button" id="starlight-toggle" class="theme-toggle-btn">🌌 點亮藍色星海</button></li>

  <!-- 1. 加上 class="gallery-page" 讓相簿佔滿整欄 -->
  <main class="gallery-page">
    <section id="stage">
      <h2>🎤 舞台神圖</h2>
      <p>《當·潮汐漫溢（Endlessly）》巡迴演唱會：<em>潮水不息、無盡生長</em></p>
      
      <!-- 2. 必須用 class="gallery-grid" 把所有 figure 包起來 -->
      <div class="gallery-grid">
        <figure>
          <!-- 3. img 要放在 img-box 裡面 -->
          <div class="img-box">
            <img src="images/stage1.jpg" alt="王俊凱舞台1">
          </div>
          <figcaption>在金髮基礎上加入薄荷藍挑染：<br><strong>「髮色隨潮水漸藍」</strong></figcaption>
        </figure>
        <figure>
          <div class="img-box">
            <img src="images/stage2.jpg" alt="王俊凱舞台2">
          </div>
          <figcaption>霧感粉髮上戴著俏皮貓耳：<br><strong>「潮汐在光線下的色彩折射」</strong></figcaption>
        </figure>
        <figure>
          <div class="img-box">
            <img src="images/stage3.jpg" alt="王俊凱舞台3">
          </div>
          <figcaption>全頭藍髮搭配皇冠與長袍：<br><strong>「小王子加冕回歸」</strong></figcaption>
        </figure>
      </div>
    </section>

    <section id="movies">
      <h2>🎬 影視劇照</h2>
      <p>不同時期的影視作品：<em>演技日漸精湛</em></p>
      
      <div class="gallery-grid">
        <figure>
          <div class="img-box">
            <img src="images/movies1.jpg" alt="影視劇照1">
          </div>
          <figcaption>「不要去想會不會，<br>只要去想做不做。」</figcaption>
        </figure>
        <figure>
          <div class="img-box">
            <img src="images/movies2.jpg" alt="影視劇照2">
          </div>
          <figcaption>「鷹之所以飛得高，不是因為風，<br>而是它有一雙自由的翅膀。」</figcaption>
        </figure>
        <figure>
          <div class="img-box">
            <img src="images/movies3.jpg" alt="影視劇照3">
          </div>
          <figcaption>「黑夜給我，黎明給你。」</figcaption>
        </figure>
      </div>
    </section>

    <section id="daily">
      <h2>📷 日常碎片</h2>
      <p>舞台上光芒萬丈，日常也是：<em>帥呆的大男孩</em></p>
      
      <div class="gallery-grid">
        <figure>
          <div class="img-box">
            <img src="images/daily1.jpg" alt="日常照片1">
          </div>
          <figcaption>在澳洲遊玩，<br>和偶像<strong>周杰倫</strong>合影的小凱</figcaption>
        </figure>
        <figure>
          <div class="img-box">
            <img src="images/daily2.jpg" alt="日常照片2">
          </div>
          <figcaption>剛錄完綜藝<strong>你好星期六</strong>，<br>褲子-1的小凱</figcaption>
        </figure>
        <figure>
          <div class="img-box">
            <img src="images/daily3.jpg" alt="日常照片3">
          </div>
          <figcaption>下班休息，看起來<strong>疲憊</strong>的小凱</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 小螃蟹後援會</p>
    <p><a href="index.html">← 返回推坑首頁</a> ｜ <a href="#">↑ 回到最上面</a></p>
  </footer>
  <script src="countdown.js"></script>
</body>
</html>
